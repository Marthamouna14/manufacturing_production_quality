services:
  api:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: manufacturing_db
      MYSQL_USER: manufacturing_user
      MYSQL_PASSWORD: manufacturing_password
      MYSQL_ROOT_PASSWORD: root_password_change_me
    ports: ["3307:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-proot_password_change_me"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  mysql_data:
